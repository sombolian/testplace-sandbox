<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0f">
    <title>DevEx Calculator</title>
    <link rel="icon" href="robuxicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <!-- Status bar spacer -->
        <div class="status-bar-spacer"></div>

        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <button id="memorialButton" class="memorial-btn" aria-label="Memorial">
                    <div class="memorial-candle-icon">
                        <div class="mini-flame"></div>
                        <div class="mini-candle-body"></div>
                    </div>
                </button>
            </div>
            <div class="header-center">
                <img src="robuxicon.svg" alt="Robux" class="header-logo">
                <h1>DevEx Calc</h1>
            </div>
            <div class="header-right">
                <button id="currencyButton" class="currency-btn" aria-label="Select currency">
                    <span id="selectedCurrencyText" class="currency-btn-text">USD</span>
                    <span id="dropdownArrow" class="currency-btn-arrow">&#9662;</span>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Output Display -->
            <div class="display-card">
                <div class="display-label" id="displayLabel">ROBUX TO USD</div>
                <div class="display-value" id="output">$0.00</div>
                <div class="display-secondary" id="outputSecondary"></div>
            </div>

            <!-- Input Area -->
            <div class="input-section">
                <div class="input-wrapper">
                    <span class="input-icon" id="inputIcon">
                        <img src="robuxicon.svg" alt="R$" class="robux-input-icon">
                    </span>
                    <input id="amountInput" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
                </div>
            </div>

            <!-- Controls -->
            <div class="controls-section">
                <!-- Direction Toggle -->
                <button id="toggleButton" class="direction-toggle">
                    <div class="toggle-inner">
                        <span class="toggle-from" id="toggleFrom">
                            <img src="robuxicon.svg" alt="R$" class="toggle-icon">
                            <span>Robux</span>
                        </span>
                        <span class="toggle-arrow">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M7 16l-4-4 4-4"/>
                                <path d="M17 8l4 4-4 4"/>
                                <line x1="3" y1="12" x2="21" y2="12"/>
                            </svg>
                        </span>
                        <span class="toggle-to" id="toggleTo">
                            <span>USD</span>
                            <span class="toggle-dollar">$</span>
                        </span>
                    </div>
                </button>

                <!-- Fee Toggle -->
                <div class="fee-toggle-card">
                    <div class="fee-info">
                        <span class="fee-label">30% Marketplace Fee</span>
                        <span class="fee-sublabel" id="feeStatus">OFF</span>
                    </div>
                    <div class="toggle-switch">
                        <input type="checkbox" id="feeToggle" class="toggle-input">
                        <label for="feeToggle" class="toggle-track">
                            <span class="toggle-thumb"></span>
                        </label>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <a href="https://buymeacoffee.com/fiery.fire" target="_blank" class="support-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.216 6.415l-.132-.666c-.119-.598-.388-1.163-1.001-1.379-.197-.069-.42-.098-.57-.241-.152-.143-.196-.366-.231-.572-.065-.378-.125-.756-.192-1.133-.057-.325-.102-.69-.25-.987-.195-.4-.597-.634-.996-.788a5.723 5.723 0 00-.626-.194c-1-.263-2.05-.36-3.077-.416a25.834 25.834 0 00-3.7.062c-.915.083-1.88.184-2.75.5-.318.116-.646.256-.888.501-.297.302-.393.77-.177 1.146.154.267.415.456.692.58.36.162.737.284 1.123.366 1.075.238 2.189.331 3.287.37 1.218.05 2.437.01 3.65-.118.299-.033.598-.073.896-.119.352-.054.578-.513.474-.834-.124-.383-.457-.531-.834-.473-.466.074-.96.108-1.382.146-1.177.08-2.358.082-3.536.006a22.228 22.228 0 01-1.157-.107c-.086-.01-.18-.025-.258-.036-.243-.036-.484-.08-.724-.13-.111-.027-.111-.185 0-.212h.005c.277-.06.557-.108.838-.147h.002c.131-.009.263-.032.394-.048a25.076 25.076 0 013.426-.12c.674.019 1.347.067 2.017.144l.228.031c.267.04.533.088.798.145.392.085.895.113 1.07.542.055.137.08.288.111.431l.319 1.484a.237.237 0 01-.199.284h-.003c-.037.006-.075.01-.112.015a36.704 36.704 0 01-4.743.295 37.059 37.059 0 01-4.699-.304c-.14-.017-.293-.042-.417-.06-.326-.048-.649-.108-.973-.161-.393-.065-.768-.032-1.123.161-.29.16-.527.404-.675.701-.154.316-.199.66-.267 1-.069.34-.176.707-.135 1.056.087.753.613 1.365 1.37 1.502a39.69 39.69 0 0011.343.376.483.483 0 01.535.53l-.071.697-1.018 9.907c-.041.41-.047.832-.125 1.237-.122.637-.553 1.028-1.182 1.171-.577.131-1.165.185-1.55.849-.142.24-.112.518-.034.769.312.998 1.283 1.428 2.253 1.027.943-.39 1.553-1.156 1.787-2.134.148-.616.195-1.25.255-1.878l.662-6.458.17-1.663.017-.156a.472.472 0 01.47-.432h.002c.608-.001 1.217-.03 1.823-.086.906-.083 1.677-.464 2.179-1.271.307-.493.452-1.052.51-1.632.024-.237.028-.476-.003-.716"/></svg>
                Support this project
            </a>
        </footer>
    </div>

    <!-- Currency Modal -->
    <div id="currencyModal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <h2>Select Currency</h2>
                <button id="closeCurrencyModal" class="modal-close" aria-label="Close">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-search">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="currencySearch" placeholder="Search currencies..." autocomplete="off">
            </div>
            <div class="currency-list" id="currencyList"></div>
        </div>
    </div>

    <!-- Memorial Modal -->
    <div id="memorialModal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-sheet memorial-sheet">
            <div class="modal-handle"></div>
            <div class="modal-header memorial-header">
                <h2>In Loving Memory</h2>
                <button id="closeMemorialModal" class="modal-close" aria-label="Close">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="memorial-content">
                <div class="memorial-candles-row">
                    <div class="candle"><div class="flame"></div><div class="candle-body"></div></div>
                    <div class="candle"><div class="flame"></div><div class="candle-body"></div></div>
                    <div class="candle"><div class="flame"></div><div class="candle-body"></div></div>
                </div>
                <div class="memorial-photo-frame">
                    <img src="charlie.webp" alt="Charles James Kirk" class="memorial-photo" onerror="this.style.display='none'">
                </div>
                <p class="memorial-name">Charles James Kirk</p>
                <div class="memorial-candles-row">
                    <div class="candle"><div class="flame"></div><div class="candle-body"></div></div>
                    <div class="candle"><div class="flame"></div><div class="candle-body"></div></div>
                    <div class="candle"><div class="flame"></div><div class="candle-body"></div></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/10.0.0/math.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
